<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hechizos de Voz - Fix Mobile</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #0a0a15; color: white; font-family: sans-serif; overflow: hidden; touch-action: none; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; padding: 15px; z-index: 10; pointer-events: none; box-sizing: border-box; }
        .stats h2, .stats h3 { margin: 5px 0; font-size: 1.2rem; text-shadow: 2px 2px 4px #000; }
        #lastWordLabel { color: #f0f; font-weight: bold; font-size: 1rem; margin-top: 10px; background: rgba(0,0,0,0.4); display: inline-block; padding: 2px 10px; border-radius: 10px; }
        #btnReglas { position: absolute; top: 15px; right: 15px; pointer-events: auto; padding: 8px 15px; background: #1a1a2e; color: #0cf; border: 1px solid #0cf; border-radius: 5px; font-weight: bold; }

        #overlay { display: flex; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: #0a0a15; justify-content: center; align-items: center; text-align: center; }
        .card { background: #1a1a2e; padding: 25px; border-radius: 20px; border: 2px solid #0cf; width: 85%; max-width: 400px; pointer-events: auto; }
        .keyword { padding: 2px 5px; border-radius: 4px; font-weight: bold; }
        
        button#startBtn { 
            padding: 15px 30px; cursor: pointer; background: #0cf; color: #000; 
            border: none; border-radius: 50px; font-weight: bold; font-size: 1.2em;
            box-shadow: 0 5px 15px rgba(0,204,255,0.4); margin-top: 20px;
        }
        button:disabled { background: #444; color: #888; cursor: not-allowed; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="stats">
            <h2 id="scoreLabel">Puntos: 0</h2>
            <h3 id="levelLabel">Nivel: 1</h3>
            <h3 id="timerLabel">Tiempo: 30s</h3>
            <div id="lastWordLabel">Esperando hechizo...</div>
        </div>
        <button id="btnReglas" onclick="location.reload()">REINICIAR</button>
    </div>

    <div id="overlay">
        <div class="card">
            <h2 style="color: #0cf">SPELLS ACADEMY</h2>
            <p>Destruye los objetos con tu voz:</p>
            <div style="text-align: left; display: inline-block; line-height: 2;">
                <li>🟦 Di <b>"HIELO"</b> (Cuadrado)</li>
                <li>🔴 Di <b>"FUEGO"</b> (Círculo)</li>
                <li>🟡 Di <b>"RAYO"</b> (Triángulo)</li>
            </div>
            <p style="font-size: 0.8em; color: #888; margin-top: 15px;">Usa Chrome y acepta el micrófono.</p>
            <button id="startBtn">INICIAR JUEGO</button>
        </div>
    </div>

<script>
let elements = [];
let particles = [];
let score = 0, level = 1, timeLeft = 30;
let isPaused = true, lastSecond = 0;
let recognition;

// --- LÓGICA DE INICIO REFORZADA ---
async function startFullExperience() {
    const btn = document.getElementById('startBtn');
    btn.disabled = true;
    btn.innerText = "CONECTANDO...";

    try {
        // 1. Activar Audio Context de p5.js
        if (typeof userStartAudio === 'function') {
            await userStartAudio();
        }

        // 2. Pedir permiso de micrófono explícitamente
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach(track => track.stop()); // Cerramos el test de micro

        // 3. Inicializar reconocimiento de voz
        initSpeechRecognition();

        // 4. Iniciar el bucle de juego y quitar overlay
        document.getElementById('overlay').style.display = 'none';
        isPaused = false;
        lastSecond = millis();
        console.log("Juego Iniciado correctamente");

    } catch (err) {
        console.error(err);
        alert("Error: No se pudo acceder al micrófono. Asegúrate de estar en HTTPS y dar permisos.");
        btn.disabled = false;
        btn.innerText = "REINTENTAR";
    }
}

function initSpeechRecognition() {
    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Speech) {
        alert("Este navegador no soporta Reconocimiento de Voz.");
        return;
    }

    recognition = new Speech();
    recognition.lang = 'es-ES';
    recognition.continuous = true;
    recognition.interimResults = false;

    recognition.onresult = (event) => {
        if (isPaused) return;
        const result = event.results[event.results.length - 1][0].transcript.toLowerCase();
        checkSpell(result);
    };

    recognition.onend = () => {
        if (!isPaused) {
            try { recognition.start(); } catch (e) {}
        }
    };

    recognition.start();
}

function checkSpell(word) {
    document.getElementById('lastWordLabel').innerText = "Dijiste: " + word;
    let target = "";
    if (word.includes("hielo")) target = "cuadrado";
    if (word.includes("fuego")) target = "circulo";
    if (word.includes("rayo")) target = "triangulo";

    if (target !== "") {
        let hit = false;
        for (let i = elements.length - 1; i >= 0; i--) {
            if (elements[i].type === target) {
                explode(elements[i].x, elements[i].y, elements[i].col);
                elements.splice(i, 1);
                score += 10;
                hit = true;
            }
        }
        if (hit && elements.length < 2) spawnElements();
    }
}

// --- P5.JS ---
function setup() {
    createCanvas(windowWidth, windowHeight);
    spawnElements();
}

function draw() {
    if (isPaused) return;
    background(10, 10, 25);

    if (millis() - lastSecond > 1000) {
        timeLeft--;
        lastSecond = millis();
        if (timeLeft <= 0) nextLevel();
    }

    for (let e of elements) {
        e.x += e.vx; e.y += e.vy;
        if (e.x < 30 || e.x > width - 30) e.vx *= -1;
        if (e.y < 30 || e.y > height - 30) e.vy *= -1;
        
        fill(e.col);
        push();
        translate(e.x, e.y);
        rotate(frameCount * 0.02);
        if (e.type === 'cuadrado') rect(-25, -25, 50, 50);
        else if (e.type === 'circulo') ellipse(0, 0, 55, 55);
        else if (e.type === 'triangulo') triangle(0, -30, 30, 25, -30, 25);
        pop();
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].show();
        if (particles[i].done()) particles.splice(i, 1);
    }
    updateUI();
}

function spawnElements() {
    let count = 2 + level;
    for (let i = 0; i < count; i++) {
        let type = random(['cuadrado', 'circulo', 'triangulo']);
        let col = type === 'cuadrado' ? color(0, 204, 255) : (type === 'circulo' ? color(255, 51, 51) : color(255, 255, 0));
        elements.push({
            x: random(50, width-50), y: random(50, height-50),
            vx: random(-1.5, 1.5), vy: random(-1.5, 1.5),
            type: type, col: col
        });
    }
}

function nextLevel() {
    level++;
    timeLeft = 30;
    spawnElements();
}

function updateUI() {
    document.getElementById('scoreLabel').innerText = `Puntos: ${score}`;
    document.getElementById('levelLabel').innerText = `Nivel: ${level}`;
    document.getElementById('timerLabel').innerText = `Tiempo: ${timeLeft}s`;
}

document.getElementById('startBtn').onclick = startFullExperience;

function explode(x, y, col) {
    for (let i = 0; i < 10; i++) particles.push(new Particle(x, y, col));
}

class Particle {
    constructor(x, y, col) {
        this.pos = createVector(x, y);
        this.v = p5.Vector.random2D().mult(random(2, 5));
        this.a = 255; this.c = col;
    }
    update() { this.pos.add(this.v); this.a -= 10; }
    done() { return this.a <= 0; }
    show() { noStroke(); fill(red(this.c), green(this.c), blue(this.c), this.a); ellipse(this.pos.x, this.pos.y, 6); }
}

function windowResized() { resizeCanvas(windowWidth, windowHeight); }
</script>
</body>
</html>
