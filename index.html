<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hechizos de Voz - Inicio Directo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #0a0a15; color: white; font-family: sans-serif; overflow: hidden; touch-action: none; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; padding: 15px; z-index: 10; pointer-events: none; box-sizing: border-box; }
        .stats h2, .stats h3 { margin: 5px 0; font-size: 1.1rem; text-shadow: 2px 2px 4px #000; }
        #lastWordLabel { color: #0cf; font-weight: bold; font-size: 1.2rem; margin-top: 10px; background: rgba(0,0,0,0.6); display: inline-block; padding: 5px 15px; border-radius: 10px; border: 1px solid #0cf3; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="stats">
            <h2 id="scoreLabel">Puntos: 0</h2>
            <h3 id="levelLabel">Nivel: 1</h3>
            <h3 id="timerLabel">Tiempo: 30s</h3>
            <div id="lastWordLabel">Escuchando hechizos...</div>
        </div>
    </div>

<script>
let elements = [];
let particles = [];
let score = 0, level = 1, timeLeft = 30;
let lastSecond = 0;
let recognition;

// --- RECONOCIMIENTO DE VOZ (Igual al de la neblina) ---
function initSpeech() {
    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Speech) return;

    recognition = new Speech();
    recognition.lang = 'es-ES';
    recognition.continuous = true;
    recognition.interimResults = false;

    recognition.onresult = (e) => {
        const result = e.results[e.results.length - 1][0].transcript.toLowerCase();
        document.getElementById('lastWordLabel').innerText = "Dijiste: " + result;
        checkSpell(result);
    };

    recognition.onend = () => { 
        try { recognition.start(); } catch(e) {} 
    };

    try {
        recognition.start();
    } catch(e) {
        console.log("Error al iniciar reconocimiento automático");
    }
}

function checkSpell(word) {
    let target = "";
    if (word.includes("hielo")) target = "cuadrado";
    if (word.includes("fuego")) target = "circulo";
    if (word.includes("rayo")) target = "triangulo";

    if (target !== "") {
        let hit = false;
        for (let i = elements.length - 1; i >= 0; i--) {
            if (elements[i].type === target) {
                explode(elements[i].x, elements[i].y, elements[i].col);
                elements.splice(i, 1);
                score += 10;
                hit = true;
            }
        }
        if (hit && elements.length < 3) spawnElements();
    }
}

// --- P5.JS MOTOR ---
function setup() {
    createCanvas(windowWidth, windowHeight);
    lastSecond = millis();
    spawnElements();
    
    // Iniciar voz automáticamente igual que en el código de la neblina
    initSpeech();
}

function draw() {
    background(10, 10, 25);

    // Lógica de tiempo
    if (millis() - lastSecond > 1000) {
        timeLeft--;
        lastSecond = millis();
        if (timeLeft <= 0) {
            level++;
            timeLeft = 30;
            spawnElements();
        }
    }

    // Dibujar y mover elementos
    for (let e of elements) {
        e.x += e.vx; e.y += e.vy;
        if (e.x < 30 || e.x > width - 30) e.vx *= -1;
        if (e.y < 30 || e.y > height - 30) e.vy *= -1;
        
        fill(e.col);
        push();
        translate(e.x, e.y);
        rotate(frameCount * 0.02);
        if (e.type === 'cuadrado') rect(-25, -25, 50, 50);
        else if (e.type === 'circulo') ellipse(0, 0, 55, 55);
        else if (e.type === 'triangulo') triangle(0, -30, 30, 25, -30, 25);
        pop();
    }

    // Partículas de explosión
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].show();
        if (particles[i].done()) particles.splice(i, 1);
    }

    updateUI();
}

function spawnElements() {
    let count = 2 + level;
    for (let i = 0; i < count; i++) {
        let type = ["cuadrado", "circulo", "triangulo"][Math.floor(Math.random()*3)];
        let col = type === 'cuadrado' ? color(0, 204, 255) : (type === 'circulo' ? color(255, 51, 51) : color(255, 255, 0));
        elements.push({
            x: random(50, width-50), y: random(50, height-50),
            vx: random(-1.2, 1.2), vy: random(-1.2, 1.2),
            type: type, col: col
        });
    }
}

function updateUI() {
    document.getElementById('scoreLabel').innerText = `Puntos: ${score}`;
    document.getElementById('levelLabel').innerText = `Nivel: ${level}`;
    document.getElementById('timerLabel').innerText = `Tiempo: ${timeLeft}s`;
}

function explode(x, y, col) {
    for (let i = 0; i < 10; i++) particles.push(new Particle(x, y, col));
}

class Particle {
    constructor(x, y, col) {
        this.pos = createVector(x, y);
        this.v = p5.Vector.random2D().mult(random(2, 5));
        this.a = 255; 
        this.c = col;
    }
    update() { this.pos.add(this.v); this.a -= 10; }
    done() { return this.a <= 0; }
    show() { noStroke(); fill(red(this.c), green(this.c), blue(this.c), this.a); ellipse(this.pos.x, this.pos.y, 6); }
}

function windowResized() { resizeCanvas(windowWidth, windowHeight); }

// Despertar audio en el primer toque de pantalla por si Chrome lo bloquea
function touchStarted() {
    if (getAudioContext().state !== 'running') {
        getAudioContext().resume();
    }
}
</script>
</body>
</html>
